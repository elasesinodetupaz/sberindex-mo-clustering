       quote: "Категория \"Маркетплейсы\" охватывает транзакции на онлайн-платформах, которые предоставляют площадку для продажи товаров и услуг множеством различных продавцов."}
    - {question: "2", source: "data/raw/Данные_СберИндекс_лицензия.pdf, раздел (1), категория «Маркетплейсы» (прочитан 03.10.2026)",
       quote: "Транзакции в специализированных интернет-магазинах относятся к соответствующим категориям."}
  DATA_ANSWERS:                       # п. A: ответы только по цитатам, без домысливания
    "1": "Описание называет расходы расходами жителей МО и оценкой модели по транзакционным данным. Как определяется принадлежность держателя карты к МО (место жительства или иное) и учитывается ли место транзакции, в описании набора, README и на странице конкурса не сказано."
    "2": "Явного правила «по продавцу или по товару» в описании нет. Определения категорий перечисляют транзакции по видам торговых точек и сервисов (супермаркеты, рестораны, службы доставки, онлайн-платформы); транзакции в специализированных интернет-магазинах относятся к соответствующим категориям."

