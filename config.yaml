# Гиперпараметры пайплайна — единый источник значений.
# src/config.py читает этот файл и отдаёт шагам те же имена (MONTH, FINAL_K, ROBUST_* …).
# Ключи внутри групп совпадают с именами в src/config.py.
# Диапазоны заданы как {min, max} включительно; список k собирается в src/config.py.
# Пути к данным и к справочнику МО здесь не задаются (они в самих скриптах).

# --- Данные и период ---
data:
  MONTH: "2024-12"                    # канонический месяц (декабрь 2024)

# --- Кластеризация ---
# k = 7 было каноническим до решения от 2026-09-28; заменено на k = 6 по результатам
# prediction strength (шаг 10d) и воспроизводимости транспортной группы (шаги 10d, 12, 12a).
clustering:
  FINAL_K: 6                          # каноническое число кластеров KMeans
  SUPERSEDED_K: 7                     # прежнее каноническое k (для сравнения)

# --- Сети ---
networks:
  ECON_KNN_K: 8                       # kNN экономической сети (шаги 05, 06, 08, 11, 13; шаг 14 — ROBUST_KNN_K в src/config.py)
  ROBUST_KNN_VARIANTS: [5, 8, 12]     # чувствительность Louvain к числу соседей (шаг 14, п. 4)

# --- Устойчивость ---
robustness:
  # Шаг 14: проверки устойчивости выбора k
  ROBUST_N_RUNS: 100                  # запусков KMeans для «лучшего по inertia» разбиения (п. 1)
  ROBUST_K_COMPARE: [6, 7]            # сравнение PS для вариантов признаков (п. 1)
  ROBUST_K_RANGE: {min: 2, max: 10}   # k для проверки по месяцам (п. 2)
  ROBUST_PS_SPLITS: 50                # M разбиений на половины для prediction strength (пп. 1–3)
  ROBUST_N_RANDOM: 100                # случайных разбиений для baseline S_Dbw (п. 2)
  ROBUST_SE_MULT: 2.0                 # «разница больше 2 SE» (п. 2)
  ROBUST_DECOMP_K: [4, 5, 6, 7, 8]    # k для разложения PS (п. 3)
  ROBUST_LOUVAIN_RESOLUTIONS: [0.3, 0.5, 0.7, 1.0, 1.5]   # п. 4
  ROBUST_LOUVAIN_SEEDS: 20            # запусков Louvain на каждое значение (п. 4)
  ROBUST_GAP_REFS: 50                 # эталонных выборок для gap statistic (п. 5)
  ROBUST_GAP_K_RANGE: {min: 2, max: 10}

  # Шаг 15: проверки устойчивости, батч 2
  ROBUST2_VARIANTS: ["A", "B", "C"]   # A — 5 долей от «Все категории» (канон); B — к сумме пяти; C — A + «прочее»
  ROBUST2_K: 6                        # k для сравнения вариантов признаков
  ROBUST2_K_RANGE: [4, 5, 6, 7, 8]    # k для SW, CH/N, PS по вариантам
  ROBUST2_N_RUNS: 100                 # «лучший из N запусков» по inertia
  ROBUST2_GROUP_JACCARD: 0.6          # группа «находится» в месяце, если есть кластер с Жаккаром ≥ порога
  ROBUST2_REMOTE_CLUSTER: 4           # удалённая группа: номер кластера k = 6 из шага 10b; при смене k перевыбрать
  ROBUST2_CAPITAL_CLUSTER: 3          # столичная группа: номер кластера k = 6 из шага 10b; при смене k перевыбрать
  ROBUST2_COMPARE_TOL: 0.1            # расхождение с ручными расчётами автора, которое отмечается
  ROBUST2_CONTINGENCY: [[4, 6], [5, 6], [6, 7]]   # таблицы сопряжённости по k (п. 2); пары → tuple в src/config.py
  ROBUST2_TARGET_K: 6                 # «K около 6» для Louvain (п. 3)
  ROBUST2_EXTRA_RESOLUTIONS: [0.25]   # подобрано перебором 0.10–0.25: лучший запуск даёт ровно K = 6

  # Шаг 15e: внешняя валидность вариантов признаков и выбора k
  EXTVAL_KS: [4, 5, 6, 7, 8]          # k варианта A (официальные метки шага 12a)
  EXTVAL_PERMUTATIONS: 200            # перестановок меток для z-оценки доли рёбер внутри кластеров
  EXTVAL_SEED: 1515                   # rng для перестановок
  EXTVAL_ALPHA: 0.05                  # уровень значимости для критерия Уилкоксона

# --- Отслеживание во времени ---
temporal:
  # Шаг 16: кривая стабильности по k
  STABILITY_KS: [4, 5, 6, 7, 8]       # k, для которых строится кривая (шаги 10b, 12a, 12 считаются для всех; 15f)
  KINK_RATIO: 1.5                     # «излом» на 6→7: |Δ(6→7)| ≥ KINK_RATIO × max(|Δ(5→6)|, |Δ(7→8)|)

# --- Шаг 04: сеть на сырых долях (отклонённый вариант, для сравнения) ---
step04_raw_network:
  RAW_NET_EDGE_THRESHOLD: 0.9         # ребро, если cosine similarity сырых долей > порога
  RAW_NET_CANDIDATE_THRESHOLDS: [0.9, 0.95, 0.97, 0.98, 0.99, 0.995, 0.999]   # пороги для таблицы «порог → размер сети»

# --- Шаг 07: транспортные сети ---
step07_transport:
  TRANSPORT_KNN_K: 8                  # kNN транспортных сетей; совпадает с ECON_KNN_K по значению, но это отдельный параметр
  TRANSPORT_SYMMETRY_TOL_KM: 0.5      # допустимое расхождение distance между x→y и y→x (км)
  TRANSPORT_IMPUTE_MISSING_RAILWAY_ZERO: true   # достраивать отсутствующие railway-пары внутри ж/д-сети с distance = 0
  TRANSPORT_NAMES_CHECK_KM: 50        # достроенные пары с highway distance не меньше порога (км) проверяются через названия
  TRANSPORT_DETOUR_RATIO: 3.0         # порог отношения «дорога / прямая» (типично для пар 30–100 км: медиана 1.24, p99 2.13)

# --- Шаг 08: экономическая vs транспортная близость ---
step08_econ_vs_transport:
  ECON_TRANSPORT_MONTHS: ["2024-12", "2023-01"]   # месяцы анализа (первый совпадает с MONTH, второй — начало периода)
  ECON_TRANSPORT_TOP_SIMILARITY_SHARE: 0.10       # топ-10% рёбер экономической сети по similarity
  ECON_TRANSPORT_FAR_MIN_KM: 200      # «похожие, но далеко»: дальше порога сходство перестаёт зависеть от расстояния
  ECON_TRANSPORT_CLUSTER_KM: [600, 800]      # кластер пар на ~700 км (пара → tuple в src/config.py)
  ECON_TRANSPORT_CLUSTER_MA_LOW: [350, 450]  # границы market_access для выделения в отчёте (→ tuple)
  ECON_TRANSPORT_CLUSTER_MA_HIGH: [550, 700] # (→ tuple)

# --- Шаг 10: выбор k для KMeans ---
step10_kmeans:
  KMEANS_K_RANGE: {min: 2, max: 15}   # k = 2..15 (→ range в src/config.py)
  KMEANS_RANDOM_STATE: 42
  KMEANS_N_INIT: 10
  SDBW_KW: {method: Halkidi, centr: mean, nearest_centr: true, metric: euclidean}   # параметры пакета s-dbw
  SDBW_N_RANDOM: 100                  # случайных разбиений для baseline S_Dbw
  SDBW_BASELINE_SEED: 2025            # rng seed = SDBW_BASELINE_SEED + k
  SDBW_N_BOOT: 2000                   # бутстреп по случайным разбиениям — 95% ДИ для S_Dbw norm

# --- Шаг 10d: prediction strength ---
step10d_prediction_strength:
  PS_M_SPLITS: 50                     # как параметр M в fpc::prediction.strength
  PS_SPLIT_SEED: 2005
  PS_THRESHOLDS: [0.8, 0.9]           # пороги из Tibshirani & Walther (2005); шаги 10c и 10d

# --- Шаг 10c: фиксация k, проверка плоского минимума ---
step10c_final:
  NEAR_MIN_INERTIA: 0.5               # «плоский минимум»: запуски с inertia ≤ min + 0.5
  SAME_PARTITION_ARI: 0.999           # запуски с ARI ≥ порога считаются одним и тем же разбиением
  # seed канонического разбиения совпадает с random_state шага 10: CANONICAL_SEED = KMEANS_RANDOM_STATE в src/config.py

# --- Шаг 11: Louvain (предварительный запуск) ---
step11_louvain:
  LOUVAIN_WEIGHT: "similarity"        # атрибут веса рёбер (шаги 11, 11b, 13, 15c)
  LOUVAIN_RESOLUTION: 1.0
  LOUVAIN_SEED: 42
  LOUVAIN_STABILITY_SEEDS: {min: 0, max: 9}   # проверка чувствительности Louvain к seed (→ range)

# --- Шаг 11b: устойчивость Louvain ---
step11b_louvain_stability:
  LOUVAIN_SEEDS: {min: 0, max: 99}    # 100 запусков (→ range)
  LOUVAIN_N_RANDOM_PAIRS: 30          # непересекающиеся пары запусков для «типичного» ARI
  LOUVAIN_PAIRS_RNG_SEED: 2024        # воспроизводимый выбор пар

# --- Шаг 11c: ядра сообществ Louvain ---
step11c_louvain_core:
  LOUVAIN_CORE_THRESHOLD: 0.8         # МО — «ядро» сообщества, если его средняя co с сообществом ≥ порога

# --- Шаг 12a: 100 запусков KMeans на месяц ---
step12a_runs:
  KMEANS_RUN_SEEDS: {min: 0, max: 99} # seed 0..99 (→ range); официальное разбиение — минимальная inertia

# --- Шаг 12: сопоставление кластеров во времени ---
# якорный месяц — MONTH (группа data)
step12_temporal:
  # уверенность сопоставления: margin = (расстояние до ближайшего конкурента) / (расстояние до сопоставленного)
  CONFIDENT_MARGIN: 1.5               # уверенно: взаимно ближайшие и margin ≥ 1.5
  AMBIGUOUS_MARGIN: 1.2               # неоднозначно: не взаимно ближайшие или margin < 1.2
  CONFIDENT_SHARE_MIN: 0.5            # кластер «слабо устойчив во времени», если уверенных месяцев < 50%
  PROBLEM_MONTH_MIN_AMBIGUOUS: 2      # проблемный месяц: ≥ 2 неоднозначных сопоставлений ...
  PROBLEM_SWITCH_IQR: 1.5             # ... или доля смен выше Q3 + 1.5·IQR
  PERIOD_WINDOW: 6                    # окно (мес.) для доминирующего кластера
  STABLE_MIN_MONTHS: 2                # смена «устойчивая», если новый кластер держится ≥ 2 мес. подряд
  MIN_CONF_MONTHS_IN_WINDOW: 3        # (в) с фильтром: окно учитывается, если уверенных месяцев ≥ 3 из 6
  CONF_THRESHOLD: 0.7                 # уверенность принадлежности МО (шаг 12a): основной порог
  CONF_THRESHOLDS: [0.5, 0.6, 0.7, 0.8, 0.9]   # пороги для таблицы чувствительности
  BORDERLINE_CONF: 0.5                # «пограничное» МО: уверенность < 0.5 ...
  BORDERLINE_MIN_SHARE: 0.5           # ... более чем в половине месяцев
  TEMPORAL_THRESHOLD: 0.6             # «пограничные во времени»: доля месяцев в основном кластере ниже порога
  TEMPORAL_THRESHOLDS: [0.5, 0.6, 0.7]
  SWING_TOP2_MIN: 0.8                 # «качающиеся»: ≥ 80% месяцев в двух самых частых кластерах
  SWING_TOP2_ALT: [0.7, 0.8, 0.9]
  CENTROID_SPACE: "zscore"            # пространство центроидов для сопоставления: raw / raw_centered / zscore
  TREND_CONFOUND_ABS_CORR: 0.7        # |corr(медианное расстояние до якоря, номер месяца)| выше порога → тренд доминирует

# --- Шаг 13: Louvain по месяцам ---
step13_louvain_monthly:
  LOUVAIN_MONTHLY_N_SEEDS: 20
  NEST_PURITY: 0.8                    # сообщество «вложено», если ≥ 80% его МО — в одном кластере KMeans
  TYPICAL_Z: 2.0                      # «картина декабря типична», если в пределах TYPICAL_Z ст. откл. от среднего по месяцам

# --- Шаг 15d: gap statistic ---
step15d_gap:
  GAP_SEED: 2001

# --- Шаг 17: извлечение данных Росстата (БД ПМО) для проверки гипотез ---
# коды показателей и условия отбора строк — в самом скрипте src/17_rosstat_extract.py
step17_rosstat:
  ROSSTAT_POP_YEARS: [2023, 2024, 2025]     # население и возраст (на 1 января)
  ROSSTAT_LABOUR_YEARS: [2023, 2024]        # зарплата и численность работников (январь–декабрь)
  ROSSTAT_CHUNKSIZE: 1000000                # строк csv за одно чтение из архива
  ROSSTAT_ANOMALY_SHARE_TOL: 0.05           # anomaly: |сумма трёх возрастных долей − 1| > 0.05

# --- Шаг 18a: пороги для гипотез Г1–Г4, Г7, Г8 (предрегистрация; шаг 19 их использует) ---
# Источники переменных (source): market_access — data/raw/market_access.parquet (log);
# railway — data/processed/railway_degree.parquet; rosstat — data/external/rosstat_mo_2023_2025.parquet
# (МО-годы с anomaly исключаются); shares — data/processed/category_shares.parquet, period: month —
# месяц разбиения (для канонического декабрьского — 2024-12), mean2024 — среднее за 12 месяцев 2024;
# health_resid — ранги доли минус линейная регрессия на ранги share_older года older_year.
# column со звёздочкой (share_okved_*) раскрывается в разделы A–S.
step18_thresholds:
  ALPHA: 0.05                         # уровень для p по декабрьскому разбиению
  MONTHS_RULE: 23                     # «подтверждено»: ещё и obs_m > p95_m не менее чем в 23 из 24 месяцев
  N_PERM: 5000                        # перестановок в нулевом распределении
  MIN_GROUP: 5                        # тип с меньшим числом МО с данными исключается из теста переменной
  HYP_MIN_TYPES: 3                    # меньше 3 оставшихся типов → «не оценивается»
  HYP_MIN_REGION_N: 3                 # регион с меньшим числом МО с данными не участвует в уровне «внутри регионов»
  HYP_SEED: 180000                    # seed комбинации = HYP_SEED + её номер в таблице порогов
  HYP_PERM_BATCH: 500                 # перестановок в одном батче
  HYP_CONTROL_SEED: 18                # отрицательные контроли: генерация переменных и их нулей
  HYP_NEG1_N_VARS: 500                # отрицательный контроль №1: независимые N(0,1)
  HYP_NEG2_N_VARS: 200                # отрицательный контроль №2: a_region + e
  HYP_NEG_MAX_SHARE: 0.07             # допустимая доля «подтверждено» у отрицательных контролей
  HYP_POSITIVE_CONTROLS: [share_Общепит, share_Транспорт]
  HYP_KW_VARIABLES:                   # переменные Краскела–Уоллиса по типам
    - {hypothesis: Г1, variable: log_market_access, source: market_access, transform: log, variant: основной}
    - {hypothesis: Г1, variable: has_railway, source: railway, column: has_railway, variant: основной}
    - {hypothesis: Г4, variable: "share_okved_*_2023", source: rosstat, column: "share_okved_*", year: 2023, variant: основной}
    - {hypothesis: Г4, variable: "share_okved_*_2024", source: rosstat, column: "share_okved_*", year: 2024, variant: чувствительность}
    - {hypothesis: Г7, variable: share_health, source: shares, column: share_Здоровье, period: month, variant: основной}
    - {hypothesis: Г7, variable: share_health_mean2024, source: shares, column: share_Здоровье, period: mean2024, variant: чувствительность}
    - {hypothesis: Г7, variable: share_health_resid_older2023, source: health_resid, column: share_Здоровье, period: month, older_year: 2023, variant: основной}
    - {hypothesis: Г7, variable: share_health_resid_older2024, source: health_resid, column: share_Здоровье, period: month, older_year: 2024, variant: чувствительность}
    - {hypothesis: Г8, variable: log_population_2023, source: rosstat, column: population, year: 2023, transform: log, variant: основной}
    - {hypothesis: Г8, variable: log_population_2024, source: rosstat, column: population, year: 2024, transform: log, variant: чувствительность}
  HYP_CORR_PAIRS:                     # пары Спирмена (МО-уровень, не зависят от разбиения)
    - {hypothesis: Г2, variable: "share_Маркетплейсы~log_market_access", sign: "+", variant: основной, exclude_federal: false,
       x: {source: shares, column: share_Маркетплейсы, period: month}, y: {source: market_access, transform: log}}
    - {hypothesis: Г2, variable: "share_Маркетплейсы_mean2024~log_market_access", sign: "+", variant: чувствительность, exclude_federal: false,
       x: {source: shares, column: share_Маркетплейсы, period: mean2024}, y: {source: market_access, transform: log}}
    - {hypothesis: Г3, variable: "share_Продовольствие~wage_rel_region_2023", sign: "-", variant: основной, exclude_federal: false,
       x: {source: shares, column: share_Продовольствие, period: month}, y: {source: rosstat, column: wage_rel_region, year: 2023}}
    - {hypothesis: Г3, variable: "share_Продовольствие_mean2024~wage_rel_region_2023", sign: "-", variant: чувствительность, exclude_federal: false,
       x: {source: shares, column: share_Продовольствие, period: mean2024}, y: {source: rosstat, column: wage_rel_region, year: 2023}}
    - {hypothesis: Г3, variable: "share_Продовольствие~wage_rel_region_2023 (без городов фед. значения)", sign: "-", variant: чувствительность, exclude_federal: true,
       x: {source: shares, column: share_Продовольствие, period: month}, y: {source: rosstat, column: wage_rel_region, year: 2023}}

# --- Шаг 18b: пороги для гипотез Г6 и Г9 (предрегистрация; N_PERM — из step18_thresholds) ---
step18b_thresholds:
  N_NEAREST: 2                        # Г6: «ближайшие типы» — 2 типа с ближайшими центроидами (основной вариант)
  N_NEAREST_SENS: [1, 3]              # Г6: варианты чувствительности
  SEED_G6: 18601                      # Г6: seed нуля (случайные конечные типы)
  SEED_G9: 18901                      # Г9: seed перестановок месяцев

# --- Шаг 19a: проверка гипотез Г1, Г4, Г7, Г8 (пороги — замороженные шага 18a) ---
step19_tests:
  BOOT_B: 5000                        # Г7: бутстреп-повторов по МО для Δ = η²_H(доля) − η²_H(остаток)
  SEED_G7: 19701                      # Г7: seed бутстрепа
  SEED_G6: 19601                      # Г6 (шаг 19b): seed бутстрепа по МО (в src/config.py — TEST_SEED_G6)
  SEED_G9: 19901                      # Г9 (шаг 19b): seed перестановок месяцев (в src/config.py — TEST_SEED_G9)

# --- Шаг 20: извлечение данных о рознице и общепите (БД ПМО, раздел 2) ---
# коды показателей и виды объектов (obroz) — в самом скрипте src/20_rosstat_retail_extract.py
step20_retail:
  RETAIL_YEARS: [2023, 2024]                # годы извлечения
  RETAIL_PERIOD: "IV квартал"               # период показателя (другими периодами не заменяется)
  RETAIL_BATCH_ROWS: 500000                 # строк parquet за одно чтение (iter_batches)
  RETAIL_CHECK_BAND: [0.95, 1.05]           # проверка: «Магазины» / сумма 9 видов в этом диапазоне
  RETAIL_CHECK_MAX_FLOOR_PER_1000: 5000     # проверка: МО с площадью торгового зала > 5000 м² на 1000 жителей

# --- Шаг 21: пороги для дополнительных гипотез Г10–Г13 (предложение розницы и общепита; предрегистрация) ---
# Статистики, уровни, MIN_GROUP, N_PERM, разбиения и контроли — как в шагах 18/18b (step18_thresholds).
# Переменные предложения: column из data/external/rosstat_retail_2023_2024.parquet / население на 1 января
# того же года (data/external/rosstat_mo_2023_2025.parquet) × 1000; МО с anomaly, населением ≤ 0 или пропуском
# исключаются.
step21_supply:
  SEED_21: 21000                      # seed комбинации = SEED_21 + номер строки в таблице порогов
  SUPPLY_VARIABLES:
    - {name: floor_pc, column: retail_floor_m2, year: 2023}
    - {name: seats_pc, column: catering_seats_pub, year: 2023}
    - {name: floor_pc_2024, column: retail_floor_m2, year: 2024}
    - {name: seats_pc_2024, column: catering_seats_pub, year: 2024}
    - {name: stores_pc, column: retail_stores, year: 2023}
    - {name: seats_all_pc, column: catering_seats_all, year: 2023}
  SUPPLY_CORR_PAIRS:                  # Спирмен: основной — 24 месяца; чувствительность — только декабрь 2024
    - {hypothesis: Г10, share: share_Маркетплейсы, supply: floor_pc, sign: "-", variant: основной}
    - {hypothesis: Г10, share: share_Маркетплейсы, supply: floor_pc_2024, sign: "-", variant: чувствительность}
