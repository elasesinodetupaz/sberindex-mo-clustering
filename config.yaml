  NETWORK_WEIGHT: "similarity"
  LOUVAIN_K_SOURCE: "step11b"         # M8 и k метода M2: итоговый запуск шага 11b (K = число сообществ); запуск шага 11 (seed LOUVAIN_SEED) — справочный контроль
